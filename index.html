<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEM BULTEN</title>
<style>
  :root { --tq:#0d9488; --tq-dark:#0f766e; --tq-soft:#ccfbf1; --ink:#134e4a; --muted:#5b6e6c; --flag:#0099FF; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:#e6fffa; color:var(--ink); line-height:1.5; }
  .flag-bar { position:fixed; left:0; top:0; bottom:0; width:110px; background:var(--flag); z-index:20; }
  .emblem, .emblem svg { width:100%; height:100%; display:block; }
  .wrap { margin-left:110px; padding:16px; }
  .container { display:none; }
  .container.show { display:block; }
  header { background:linear-gradient(135deg,#0d9488,#14b8a6); color:#fff; border-radius:14px; padding:20px 18px 16px; margin-bottom:18px; }
  header h1 { font-size:1.9rem; }
  .last-update { font-size:.85rem; margin-top:8px; color:#ccfbf1; }
  .main-title { background:var(--tq); color:#fff; padding:10px 14px; border-radius:8px; margin:16px 0 14px; font-size:1.2rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
  .card { background:#fff; border:1px solid #99f6e4; border-left:5px solid var(--tq); border-radius:10px; padding:14px; }
  .card-header { display:flex; justify-content:space-between; gap:8px; margin-bottom:6px; font-size:.8rem; }
  .source { color:var(--tq-dark); font-weight:700; }
  .date { color:var(--muted); }
  .badge { display:inline-block; background:var(--tq-soft); color:var(--tq-dark); font-size:.68rem; font-weight:700; padding:2px 8px; border-radius:999px; margin-bottom:6px; }
  .card-title { font-size:1.02rem; font-weight:800; margin-bottom:6px; }
  .card-content { font-size:.9rem; color:#333; margin-bottom:12px; }
  .card-link { display:inline-block; background:var(--tq); color:#fff; text-decoration:none; font-weight:700; font-size:.84rem; padding:7px 12px; border-radius:7px; }
  footer { text-align:center; margin-top:24px; color:var(--muted); font-size:.85rem; }
  #login-screen { position:fixed; inset:0; background:linear-gradient(160deg,#0d9488,#115e59); display:flex; align-items:center; justify-content:center; z-index:50; }
  .login-box { width:100%; max-width:380px; background:#fff; border-radius:16px; padding:28px 22px; text-align:center; }
  .login-box h2 { color:var(--tq-dark); }
  .login-box p { color:#555; margin:8px 0 16px; }
  .login-emblem { width:220px; height:146px; margin:0 auto 14px; border:3px solid #ccfbf1; background:var(--flag); }
  .login-emblem svg { width:100%; height:100%; display:block; }
  .login-box input, .login-box button { width:100%; padding:12px; border-radius:8px; font-size:1rem; margin-bottom:10px; }
  .login-box input { border:1px solid #99f6e4; }
  .login-box button { border:0; background:var(--tq); color:#fff; font-weight:800; cursor:pointer; }
  .login-error { color:#b91c1c; min-height:18px; }
  @media (max-width:700px) { .flag-bar { width:72px; } .wrap { margin-left:72px; } }
</style>
</head>
<body>
<div class="flag-bar"><div class="emblem"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid slice"><rect width="900" height="600" fill="#0099FF"/><circle cx="360" cy="300" r="165" fill="#fff"/><circle cx="412" cy="300" r="132" fill="#0099FF"/><polygon fill="#fff" points="560,168 589,258 684,258 608,314 637,404 560,348 483,404 512,314 436,258 531,258"/></svg></div></div>
<div id="login-screen"><div class="login-box"><div class="login-emblem"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid slice"><rect width="900" height="600" fill="#0099FF"/><circle cx="360" cy="300" r="165" fill="#fff"/><circle cx="412" cy="300" r="132" fill="#0099FF"/><polygon fill="#fff" points="560,168 589,258 684,258 608,314 637,404 560,348 483,404 512,314 436,258 531,258"/></svg></div><h2>TEM BULTEN</h2><p>Sifreyi girerek devam edin</p><form id="login-form"><input id="password" type="password" placeholder="Sifre" autocomplete="current-password"><button type="submit">Giris Yap</button></form><div class="login-error" id="login-error"></div></div></div>
<div class="wrap"><div class="container" id="app">
<header><h1>TEM BULTEN</h1><p>Haber siteleri 15 dakikada bir otomatik taranir.</p><p class="last-update" id="last-update">Tarama bekleniyor</p></header>
<h2 class="main-title">Sosyal Medya</h2>
<div class="grid" id="social-grid"></div>
<h2 class="main-title">Orgut Medyasi</h2>
<div class="grid" id="org-grid"></div>
<h2 class="main-title">Yerel ve Yabanci Medya</h2>
<div class="grid" id="other-grid"></div>
<footer>TEM BULTEN • ANF / Hawar / Serxwebun ayri, DW BBC TRT ayri</footer>
</div></div>
<script>
  const PASSWORD = "184504";
  const loginScreen = document.getElementById("login-screen");
  const app = document.getElementById("app");
  function openApp(){ loginScreen.style.display="none"; app.classList.add("show"); loadFeed(); }
  if (sessionStorage.getItem("tem_ok")==="1") openApp();
  document.getElementById("login-form").addEventListener("submit", function(e){
    e.preventDefault();
    if (document.getElementById("password").value.trim()===PASSWORD) { sessionStorage.setItem("tem_ok","1"); openApp(); }
    else document.getElementById("login-error").textContent="Sifre yanlis";
  });
  function esc(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[m])); }
  function card(it){
    return '<article class="card"><div class="card-header"><span class="source">'+esc(it.source||'')+'</span><span class="date">'+esc(it.date||'')+'</span></div><div class="badge">'+esc(it.badge||'Yeni')+'</div><h3 class="card-title">'+esc(it.title||'')+'</h3><p class="card-content">'+esc(it.summary||'')+'</p><a class="card-link" href="'+esc(it.url||'#')+'" target="_blank" rel="noopener">Habere Git</a></article>';
  }
  function splitNews(d){
    const orgNames = {ANF:1,'Hawar News':1,Serxwebun:1};
    let org = d.news_org || [];
    let other = d.news_other || [];
    if (!org.length && !other.length && (d.news||[]).length) {
      org = d.news.filter(x => orgNames[x.source]);
      other = d.news.filter(x => !orgNames[x.source]);
    }
    return {org, other};
  }
  async function loadFeed(){
    try {
      const d = await (await fetch('/api/feed')).json();
      const parts = splitNews(d);
      document.getElementById('last-update').textContent = 'Son tarama: ' + (d.last_scan || 'henuz yok') + ' • 15 dakikada bir';
      document.getElementById('social-grid').innerHTML = (d.social||[]).map(card).join('') || '<p>Sosyal medya henuz dolmadi.</p>';
      document.getElementById('org-grid').innerHTML = parts.org.map(card).join('') || '<p>Orgut medyasi henuz dolmadi.</p>';
      document.getElementById('other-grid').innerHTML = parts.other.map(card).join('') || '<p>Yerel / yabanci medya henuz dolmadi.</p>';
    } catch(e) { document.getElementById('last-update').textContent = 'Besleme alinamadi'; }
  }
  setInterval(loadFeed, 60000);
</script>
</body></html>
